[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmi-pipeline"
version = "0.3.0"
description = "Magnetic tensors from VASP spin spirals"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "spglib>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dmi = "dmi_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["dmi_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# spglib 2.7+ asks callers to opt in to new error handling; symmetry.py
# already checks for a None dataset, and the opt-in does not exist in 2.6.
filterwarnings = ["ignore:Set OLD_ERROR_HANDLING:DeprecationWarning"]
