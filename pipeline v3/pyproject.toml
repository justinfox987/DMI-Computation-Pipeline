[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmi-pipeline"
version = "0.3.0"
description = "Magnetic tensors from VASP spin spirals"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dmi = "dmi_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["dmi_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
